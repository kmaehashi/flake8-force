name: "Test"
on:
  push:
  pull_request:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
        flake8: [
            'flake8==7.*',
            'git+https://github.com/pycqa/flake8.git@main',
        ]

    steps:
      - name: Git Checkout
        uses: actions/checkout@v2

      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python }}

      - name: Install flake8-force
        run: |
          pip install "${{ matrix.flake8 }}"
          pip install -v .

      - name: Setup test environment
        run: |
          python -V
          pip install pytest
          pip freeze

      - name: Run tests
        run: |
          pushd tests
          python -m pytest .
          popd

      - name: Run flake8
        run: |
          flake8
